<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quickback</title>
    <link rel="stylesheet" href="/static/app.css?v=133">
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="top-bar">
        <div>
          <p class="brand">Quickback</p>
          <h1>说完就回</h1>
        </div>
        <label class="provider">模型
          <select id="provider" aria-label="模型">
            <option value="gemini">Gemini</option>
            <option value="qwen">千问</option>
          </select>
        </label>
      </div>
      <nav class="tabs" aria-label="页面">
        <a href="/practice" id="tab-practice" class="tab is-active" aria-current="page">练习</a>
        <a href="/questions" id="tab-questions" class="tab">题目</a>
        <a href="/tasks" id="tab-tasks" class="tab">任务</a>
        <a href="/progresses" id="tab-progresses" class="tab">进展统计</a>
        <a href="/memos" id="tab-memos" class="tab">备忘</a>
      </nav>
    </header>

    <p id="banner" class="banner" hidden></p>

    <main id="practice">
      <section id="topic" class="card topic" hidden></section>
      <section id="turns"></section>
      <section id="next-prompt" class="card prompt"></section>
      <section id="recorder" class="recorder">
        <div class="record-row">
          <button type="button" id="record" class="record">开始说</button>
          <button type="button" id="finish-practice" class="finish" hidden>归档</button>
        </div>
        <div id="take-review" class="take-review" hidden>
          <p id="take-hint" class="hint">这段还在本机。听一遍，满意再送出。</p>
          <div id="take-audio"></div>
          <div class="take-actions">
            <button type="button" id="send-take" class="primary">就用这段</button>
            <button type="button" id="redo-take" class="text-btn">重说</button>
          </div>
        </div>
        <p id="rec-hint" class="hint">点一下开始，说完再点一下。听完再决定要不要送出。中文卡住了就直接说中文。最长 3 分钟。</p>
        <button type="button" id="cancel-retake" class="text-btn" hidden>取消重答</button>
        <button type="button" id="new-question" class="text-btn">换一题</button>
      </section>
    </main>

    <main id="history" hidden>
      <div class="memo-toolbar">
        <button type="button" id="history-back" class="text-btn">← 题目</button>
      </div>
      <section id="history-list" class="history"></section>
    </main>

    <main id="questions" hidden>
      <div class="memo-toolbar">
        <button type="button" id="question-open-form" class="primary memo-open-form">＋ 添加</button>
        <button type="button" id="question-open-ielts" class="question-ielts-gen">雅思口语123</button>
        <button type="button" id="question-open-history" class="question-ielts-gen">记录</button>
      </div>
      <form id="question-form" class="card question-form" hidden>
        <p class="kicker">新题目</p>
        <label>英文问题<input name="en" type="text" required maxlength="240"></label>
        <label>中文意思<input name="zh" type="text" required maxlength="240"></label>
        <label>类别
          <input name="category" type="text" maxlength="20" placeholder="可空，点选或自行输入" autocomplete="off">
        </label>
        <div class="question-category-picks" id="question-category-picks"></div>
        <div class="memo-form-actions">
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
      <section id="question-ielts-panel" class="question-ielts-panel" hidden>
        <div class="question-ielts-head">
          <div>
            <p class="kicker">雅思口语123</p>
            <p class="question-ielts-note">本批先预览，不进入练习。满意后点「加入已有题目」。</p>
          </div>
          <div class="question-ielts-actions">
            <button type="button" id="question-ielts-gen" class="question-ielts-gen">生成口语123</button>
          </div>
        </div>
        <div id="question-ielts-list" class="question-list question-ielts-list"></div>
        <div class="question-ielts-footer" id="question-ielts-footer" hidden>
          <button type="button" id="question-ielts-reshuffle" class="question-ielts-gen">换一批</button>
          <button type="button" id="question-ielts-commit" class="question-ielts-gen question-ielts-commit">加入已有题目</button>
        </div>
      </section>
      <div class="question-library-head">
        <p class="question-library-label">已有题目</p>
        <div class="question-filter" id="question-closed-filter" role="group" aria-label="归档筛选">
          <button type="button" data-closed-filter="all" class="is-on">全部</button>
          <button type="button" data-closed-filter="open">未归档</button>
          <button type="button" data-closed-filter="closed">归档</button>
        </div>
      </div>
      <section id="question-board" class="question-board">
        <section id="question-list" class="question-list"></section>
      </section>
    </main>

    <main id="progress" hidden>
      <div class="memo-toolbar">
        <button type="button" id="progress-back" class="text-btn">← 题目</button>
      </div>
      <section id="progress-root"></section>
    </main>

    <main id="progress-stats" hidden>
      <div class="memo-toolbar">
        <button type="button" id="progress-stats-back" class="text-btn">← 题目</button>
      </div>
      <section id="progress-stats-root"></section>
    </main>

    <main id="progress-run" hidden>
      <div class="memo-toolbar">
        <button type="button" id="progress-run-back" class="text-btn">← 返回</button>
      </div>
      <section id="progress-run-root"></section>
    </main>

    <main id="progresses" hidden>
      <section id="progresses-root"></section>
    </main>

    <main id="tasks" hidden>
      <section id="tasks-root"></section>
    </main>

    <main id="memos" hidden>
      <div class="memo-toolbar">
        <button type="button" id="memo-open-form" class="primary memo-open-form">＋ 添加</button>
      </div>
      <form id="memo-form" class="card memo-form" hidden>
        <p class="kicker">新备忘</p>
        <label>标题<input name="title" type="text" maxlength="80"></label>
        <label>备忘<textarea name="text" maxlength="2000" rows="4"></textarea></label>
        <label class="memo-file-pick">附件
          <input name="files" type="file" multiple accept="audio/*,video/*,image/*,.pdf,.epub,.mobi,.azw,.azw3,.txt,.md,.zip,.doc,.docx,.rtf,.odt">
        </label>
        <div id="memo-picked" class="memo-picked" hidden></div>
        <p id="memo-file-hint" class="note memo-file-hint">可选文件、音频、视频、文档或电子书，最多 8 个。</p>
        <div class="memo-form-actions">
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
      <section id="memo-list" class="memo-list"></section>
    </main>

    <footer class="foot">
      <p>录音存在这台电脑。识别和反馈会发给当前选中的模型。</p>
      <p class="cert-install"><a href="/api/cert">下载手机证书</a>安装后，再到证书信任设置里打开完全信任。</p>
    </footer>
  </div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <div id="confirm-dialog" class="confirm" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" id="confirm-ok" class="primary">删除</button>
        <button type="button" id="confirm-cancel" class="text-btn">取消</button>
      </div>
    </div>
  </div>
  <div id="memo-lightbox" class="memo-lightbox" hidden>
    <button type="button" class="memo-lightbox-close" id="memo-lightbox-close" aria-label="关闭">关闭</button>
    <img id="memo-lightbox-img" alt="" hidden>
    <iframe id="memo-lightbox-frame" class="memo-lightbox-frame" title="预览" hidden></iframe>
  </div>
  <div id="memo-upload" class="memo-upload" hidden>
    <p id="memo-upload-text" class="note"></p>
    <div class="memo-upload-bar"><span id="memo-upload-fill"></span></div>
  </div>
  <div id="memo-video-fs" class="memo-video-fs" hidden>
    <div id="memo-video-fs-frame" class="memo-video-fs-frame">
      <div class="memo-video-fs-ui" id="memo-video-fs-ui">
        <div class="memo-video-fs-top">
          <p class="memo-video-fs-hint" id="memo-video-fs-hint" hidden>横过来看更舒服</p>
          <button type="button" class="memo-video-fs-close" id="memo-video-fs-close">退出</button>
        </div>
        <button type="button" class="memo-video-fs-toggle" id="memo-video-fs-toggle" aria-label="播放或暂停"></button>
        <div class="memo-video-fs-bottom">
          <div class="memo-video-fs-row">
            <button type="button" class="memo-video-fs-play" id="memo-video-fs-play">播放</button>
            <input type="range" class="memo-video-fs-seek" id="memo-video-fs-seek" min="0" max="0" step="0.1" value="0" aria-label="进度">
            <span class="memo-video-fs-time" id="memo-video-fs-time">0:00 / 0:00</span>
          </div>
          <div class="memo-video-fs-row memo-video-fs-speeds" id="memo-video-fs-speeds" role="group" aria-label="播放速度">
            <button type="button" data-rate="0.75">0.75x</button>
            <button type="button" data-rate="1" class="is-on">1x</button>
            <button type="button" data-rate="1.25">1.25x</button>
            <button type="button" data-rate="1.5">1.5x</button>
            <button type="button" data-rate="2">2x</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/chart.umd.min.js?v=4.4.6"></script>
  <script src="/static/progress.js?v=37"></script>
  <script src="/static/progresses.js?v=5"></script>
  <script src="/static/questions.js?v=63"></script>
  <script src="/static/tasks.js?v=3"></script>
  <script src="/static/memos.js?v=30"></script>
  <script src="/static/app.js?v=86"></script>
</body>
</html>
