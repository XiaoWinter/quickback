<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quickback</title>
    <link rel="stylesheet" href="/static/app.css?v=70">
</head>
<body>
  <div class="page">
    <header class="top">
      <div>
        <p class="brand">Quickback</p>
        <h1>说完就回</h1>
      </div>
      <nav class="tabs" aria-label="页面">
        <label class="provider">模型
          <select id="provider" aria-label="模型">
            <option value="gemini">Gemini</option>
            <option value="qwen">千问</option>
          </select>
        </label>
        <button type="button" id="tab-practice" class="tab is-active">练习</button>
        <button type="button" id="tab-history" class="tab">记录</button>
        <button type="button" id="tab-questions" class="tab">题目</button>
        <button type="button" id="tab-progress" class="tab">进展</button>
      </nav>
    </header>

    <p id="banner" class="banner" hidden></p>

    <main id="practice">
      <section id="topic" class="card topic" hidden></section>
      <section id="turns"></section>
      <section id="next-prompt" class="card prompt"></section>
      <section id="recorder" class="recorder">
        <div class="record-row">
          <button type="button" id="record" class="record">开始说</button>
          <button type="button" id="finish-practice" class="finish" hidden>归档</button>
        </div>
        <div id="take-review" class="take-review" hidden>
          <p id="take-hint" class="hint">这段还在本机。听一遍，满意再送出。</p>
          <div id="take-audio"></div>
          <div class="take-actions">
            <button type="button" id="send-take" class="primary">就用这段</button>
            <button type="button" id="redo-take" class="text-btn">重说</button>
          </div>
        </div>
        <p id="rec-hint" class="hint">点一下开始，说完再点一下。听完再决定要不要送出。中文卡住了就直接说中文。最长 3 分钟。</p>
        <button type="button" id="cancel-retake" class="text-btn" hidden>取消重答</button>
        <button type="button" id="new-question" class="text-btn">换一题</button>
      </section>
    </main>

    <main id="history" hidden>
      <section id="history-list" class="history"></section>
    </main>

    <main id="questions" hidden>
      <form id="question-form" class="card question-form">
        <p class="kicker">新题目</p>
        <label>英文问题<input name="en" type="text" required maxlength="240"></label>
        <label>中文意思<input name="zh" type="text" required maxlength="240"></label>
        <button type="submit" class="primary">添加</button>
      </form>
      <section id="question-list" class="question-list"></section>
    </main>

    <main id="progress" hidden>
      <section id="progress-root"></section>
    </main>

    <main id="progress-stats" hidden>
      <section id="progress-stats-root"></section>
    </main>

    <footer class="foot">
      <p>录音存在这台电脑。识别和反馈会发给当前选中的模型。</p>
      <p class="cert-install"><a href="/api/cert">下载手机证书</a>安装后，再到证书信任设置里打开完全信任。</p>
    </footer>
  </div>
  <div id="confirm-dialog" class="confirm" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button type="button" id="confirm-ok" class="primary">删除</button>
        <button type="button" id="confirm-cancel" class="text-btn">取消</button>
      </div>
    </div>
  </div>
  <script src="/static/progress.js?v=12"></script>
  <script src="/static/questions.js?v=38"></script>
  <script src="/static/app.js?v=66"></script>
</body>
</html>
